[package]
name = "stacks"
version = "0.5.92"
description = "A terminal workspace app for developers"
authors = ["rich"]
edition = "2021"
rust-version = "1.99.1"

[lib]
name = "stacks_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.41.1", features = ["backup", "bundled", "trace"] }
portable-pty = "0.9.0"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
dirs = "7.0.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "2.5.0"
wait-timeout = "0.2.1"
libc = "0.2.191"
ignore = "0.4.34"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-notification = "2.8.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Use the current macOS notification API. This requires the app bundle to be
# code signed, including for local/free builds; tauri.conf.json uses ad-hoc signing.
notify-rust = { version = "4.18.2", features = ["preview-macos-un"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
