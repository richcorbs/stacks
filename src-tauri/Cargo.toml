[package]
name = "stacks"
version = "0.4.37"
description = "A terminal workspace app for developers"
authors = ["rich"]
edition = "2021"

[lib]
name = "stacks_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.3.2"
wait-timeout = "0.2"
libc = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Use the current macOS notification API. This requires the app bundle to be
# code signed, including for local/free builds; tauri.conf.json uses ad-hoc signing.
notify-rust = { version = "4.18", features = ["preview-macos-un"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
