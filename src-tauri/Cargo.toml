[package]
name = "stacks-tauri"
version = "0.1.0"
description = "A Tauri terminal workspace app inspired by Stacks"
authors = ["rich"]
edition = "2021"

[lib]
name = "stacks_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.3.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
